<!DOCTYPE html>
<html>
<head>
  <base target="_top">

  <meta charset="UTF-8">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 35px 40px 50px;
      background: #ffffff;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Yu Gothic",
        "YuGothic",
        "Meiryo",
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }


    /* ========================================
       上部
       ======================================== */

    .top-row {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-bottom: 28px;
      width: 100%;
    }

    .date-input {
      /*
       * 残り幅を日付欄に割り当てる。
       *
       * WEBレポート・統合レポートのボタン幅を固定し、
       * 統合レポートの右端が下のボタン類の右端と
       * 揃うようにする。
       */
      flex: 1;
      min-width: 0;

      height: 62px;

      padding: 0 22px;

      border: 2px solid #333;
      border-radius: 15px;

      font-size: 20px;

      outline: none;
    }

    .date-input:focus {
      border-color: #555;
    }


    /* ========================================
       ボタン
       ======================================== */

    button {
      border: 2px solid #333;
      border-radius: 13px;

      background: #aaf0b5;
      color: #222;

      font-size: 18px;
      font-weight: 500;

      padding: 0 24px;

      height: 60px;

      cursor: pointer;

      transition:
        filter 0.1s,
        transform 0.05s;
    }

    button:hover {
      filter: brightness(0.96);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .report-button {
      width: 170px;
      min-width: 170px;
      flex: 0 0 170px;
    }


    /* ========================================
       編集ブロック
       ======================================== */

    .editor-section {
      margin-top: 12px;
    }

    .editor-section + .editor-section {
      margin-top: 26px;
    }

    .editor-toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 12px;

      margin-bottom: 8px;
    }

    .editor-toolbar button {
      height: 52px;
      font-size: 17px;
    }


    /* ========================================
       テキストエリア共通
       ======================================== */

    textarea {
      width: 100%;

      padding: 22px;

      border: 2px solid #333;
      border-radius: 22px;

      font-family:
        Consolas,
        "Yu Gothic",
        "Meiryo",
        monospace;

      font-size: 17px;
      line-height: 1.65;

      outline: none;
    }

    textarea:focus {
      border-color: #555;
    }


    /* ========================================
       AIプロンプト
       ======================================== */

    #aiPrompt {
      min-height: 490px;

      /*
       * AIプロンプトは従来どおり
       * ユーザーが縦方向へサイズ変更可能。
       */
      resize: vertical;
    }


    /* ========================================
       手書き確認項目
       ======================================== */

    #handwriteItems {
      /*
       * JavaScriptで内容に合わせて
       * heightを自動設定するため、
       * 固定のmin-heightは小さめにする。
       */
      min-height: 120px;

      /*
       * textarea自身には縦スクロールを出さない。
       * 内容が増えたらtextareaそのものを縦に伸ばし、
       * ページ全体をスクロールして閲覧する。
       */
      overflow-y: hidden;

      /*
       * 手動リサイズすると自動高さ調整と競合するため無効。
       */
      resize: none;
    }


    /* ========================================
       状態表示
       ======================================== */

    #status {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform: translateX(-50%);

      padding: 12px 24px;

      border-radius: 10px;

      background: rgba(30, 30, 30, 0.9);
      color: white;

      font-size: 14px;

      display: none;

      z-index: 1000;
    }

    #status.error {
      background: rgba(190, 45, 45, 0.95);
    }


    /* ========================================
       処理中オーバーレイ
       ======================================== */

    #loading {
      position: fixed;

      inset: 0;

      display: none;

      align-items: center;
      justify-content: center;

      background: rgba(255, 255, 255, 0.65);

      z-index: 999;
    }

    .loading-box {
      padding: 22px 35px;

      border: 2px solid #333;
      border-radius: 15px;

      background: white;

      font-size: 18px;
      font-weight: 600;
    }


    /* ========================================
       画面幅が狭い場合
       ======================================== */

    @media (max-width: 850px) {

      body {
        padding: 20px;
      }

      .top-row {
        flex-wrap: wrap;
      }

      .date-input {
        width: 100%;
        flex: 1 0 100%;
      }

      .report-button {
        width: auto;
        min-width: 0;
        flex: 1;
      }
    }
  </style>
</head>


<body>

  <div class="container">

    <!-- ======================================
         上段
         ====================================== -->

    <div class="top-row">

      <input
        type="text"
        id="targetDate"
        class="date-input"
        placeholder="YYYY-MM-DD"
      >

      <button
        type="button"
        class="report-button"
        onclick="createWbReport()"
      >
        WBコード
      </button>
      </button>

      <button
        type="button"
        class="report-button"
        onclick="createWebReport()"
      >
        WEBレポート
      </button>

      <button
        type="button"
        class="report-button"
        onclick="createIntegratedReport()"
      >
        統合レポート
      </button>

    </div>


    <!-- ======================================
         AIプロンプト
         ====================================== -->

    <div class="editor-section">

      <div class="editor-toolbar">

        <button
          type="button"
          onclick="copyAiPrompt()"
        >
          AIプロンプトコピー
        </button>

        <button
          type="button"
          onclick="saveAiPrompt()"
        >
          AIプロンプト保存
        </button>

      </div>

      <textarea
        id="aiPrompt"
        placeholder="AIプロンプト"
      ></textarea>

    </div>


    <!-- ======================================
         手書き確認項目
         ====================================== -->

    <div class="editor-section">

      <div class="editor-toolbar">

        <button
          type="button"
          onclick="saveHandwriteItems()"
        >
          手書き確認項目保存
        </button>

      </div>

      <textarea
        id="handwriteItems"
        placeholder="手書き確認項目"
      ></textarea>

    </div>

  </div>


  <!-- 処理中 -->
  <div id="loading">
    <div class="loading-box">
      処理中...
    </div>
  </div>


  <!-- メッセージ -->
  <div id="status"></div>


<script>

/* ==================================================
 * 初期表示
 * ================================================== */

document.addEventListener(
  'DOMContentLoaded',
  function() {

    /*
     * 手書き確認項目を入力・編集した場合も
     * 内容に合わせて高さを自動調整する。
     */
    const handwriteTextarea =
      document.getElementById(
        'handwriteItems'
      );

    handwriteTextarea.addEventListener(
      'input',
      function() {
        autoResizeHandwriteItems();
      }
    );


    setLoading(true);

    google.script.run

      .withSuccessHandler(
        function(data) {

          document
            .getElementById('targetDate')
            .value =
              data.date || '';

          document
            .getElementById('aiPrompt')
            .value =
              data.aiPrompt || '';

          document
            .getElementById('handwriteItems')
            .value =
              data.handwriteItems || '';


          /*
           * Script Propertiesの内容をセットしたあとに
           * textareaの高さを実データに合わせる。
           */
          autoResizeHandwriteItems();


          setLoading(false);
        }
      )

      .withFailureHandler(
        handleError
      )

      .getInitialData();
  }
);


/* ==================================================
 * 手書き確認項目 高さ自動調整
 * ================================================== */

/**
 * 手書き確認項目の内容が
 * textarea内でスクロールしなくても
 * すべて表示される高さへ自動調整する。
 */
function autoResizeHandwriteItems() {

  const textarea =
    document.getElementById(
      'handwriteItems'
    );


  /*
   * 一度高さを縮めてからscrollHeightを取得する。
   *
   * これにより文章を削除した場合も
   * textareaを小さく戻せる。
   */
  textarea.style.height =
    'auto';


  textarea.style.height =
    textarea.scrollHeight +
    'px';
}


/* ==================================================
 * 手書き確認項目保存
 * ================================================== */

function saveHandwriteItems() {

  const text =
    document
      .getElementById('handwriteItems')
      .value;

  setLoading(true);

  google.script.run

    .withSuccessHandler(
      function(result) {

        setLoading(false);

        showStatus(
          result.message ||
          '保存しました。'
        );
      }
    )

    .withFailureHandler(
      handleError
    )

    .saveHandwriteItems(text);
}


/* ==================================================
 * AIプロンプト保存
 * ================================================== */

function saveAiPrompt() {

  const text =
    document
      .getElementById('aiPrompt')
      .value;

  setLoading(true);

  google.script.run

    .withSuccessHandler(
      function(result) {

        setLoading(false);

        showStatus(
          result.message ||
          '保存しました。'
        );
      }
    )

    .withFailureHandler(
      handleError
    )

    .saveAiPrompt(text);
}


/* ==================================================
 * AIプロンプトコピー
 * ================================================== */

async function copyAiPrompt() {

  const text =
    document
      .getElementById('aiPrompt')
      .value;

  try {

    await navigator.clipboard.writeText(
      text
    );

    showStatus(
      'AIプロンプトをコピーしました。'
    );

  } catch (error) {

    /*
     * clipboard API が使えない環境用
     */
    const textarea =
      document.getElementById(
        'aiPrompt'
      );

    textarea.focus();
    textarea.select();

    const success =
      document.execCommand('copy');

    textarea.setSelectionRange(
      0,
      0
    );

    if (!success) {
      throw error;
    }

    showStatus(
      'AIプロンプトをコピーしました。'
    );
  }
}

/* ==================================================
 * WBコード
 * ================================================== */

function createWbReport() {

  const date =
    getTargetDate();

  if (!date) {
    return;
  }

  setLoading(true);

  google.script.run

    .withSuccessHandler(
      function(result) {

        setLoading(false);

        downloadHtml(
          result.fileName,
          result.text
        );

        showStatus(
          'WBコードを作成しました。'
        );
      }
    )

    .withFailureHandler(
      handleError
    )

    .createWbReport(date);
}
/* ==================================================
 * WEBレポート
 * ================================================== */

function createWebReport() {

  const date =
    getTargetDate();

  if (!date) {
    return;
  }

  setLoading(true);

  google.script.run

    .withSuccessHandler(
      function(result) {

        setLoading(false);

        downloadText(
          result.fileName,
          result.text
        );

        showStatus(
          'WEBレポートを作成しました。'
        );
      }
    )

    .withFailureHandler(
      handleError
    )

    .createWebReport(date);
}


/* ==================================================
 * 統合レポート
 * ================================================== */

function createIntegratedReport() {

  const date =
    getTargetDate();

  if (!date) {
    return;
  }

  setLoading(true);

  google.script.run

    .withSuccessHandler(
      function(result) {

        setLoading(false);

        downloadText(
          result.fileName,
          result.text
        );

        showStatus(
          '統合レポートを作成しました。'
        );
      }
    )

    .withFailureHandler(
      handleError
    )

    .createIntegratedReport(date);
}


/* ==================================================
 * 日付
 * ================================================== */

function getTargetDate() {

  const value =
    document
      .getElementById('targetDate')
      .value
      .trim();

  if (
    !/^\d{4}-\d{2}-\d{2}$/.test(value)
  ) {

    showStatus(
      '日付は YYYY-MM-DD 形式で入力してください。',
      true
    );

    return null;
  }

  return value;
}

/* ==================================================
 * HTMLダウンロード
 * ================================================== */

function downloadHtml(
  fileName,
  html
) {

  const bom =
    '\uFEFF';


  const blob =
    new Blob(
      [
        bom,
        html
      ],
      {
        type:
          'text/html;charset=utf-8'
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const anchor =
    document.createElement(
      'a'
    );


  anchor.href =
    url;

  anchor.download =
    fileName;


  document.body.appendChild(
    anchor
  );


  anchor.click();


  anchor.remove();


  setTimeout(
    function() {

      URL.revokeObjectURL(
        url
      );

    },
    1000
  );
}
/* ==================================================
 * TXTダウンロード
 * ================================================== */

function downloadText(
  fileName,
  text
) {

  /*
   * BOMを付与。
   * Windowsのメモ帳・Excel等でも
   * UTF-8として認識しやすくする。
   */
  const bom = '\uFEFF';

  const blob =
    new Blob(
      [
        bom,
        text
      ],
      {
        type:
          'text/plain;charset=utf-8'
      }
    );

  const url =
    URL.createObjectURL(blob);

  const anchor =
    document.createElement('a');

  anchor.href = url;
  anchor.download = fileName;

  document.body.appendChild(anchor);

  anchor.click();

  anchor.remove();

  setTimeout(
    function() {
      URL.revokeObjectURL(url);
    },
    1000
  );
}


/* ==================================================
 * エラー
 * ================================================== */

function handleError(error) {

  setLoading(false);

  let message =
    'エラーが発生しました。';

  if (error) {

    if (error.message) {
      message = error.message;
    } else {
      message = String(error);
    }
  }

  console.error(error);

  showStatus(
    message,
    true,
    8000
  );
}


/* ==================================================
 * 状態表示
 * ================================================== */

let statusTimer = null;


function showStatus(
  message,
  isError,
  duration
) {

  const element =
    document.getElementById(
      'status'
    );

  element.textContent =
    message;

  element.classList.toggle(
    'error',
    !!isError
  );

  element.style.display =
    'block';

  if (statusTimer) {
    clearTimeout(statusTimer);
  }

  statusTimer =
    setTimeout(
      function() {

        element.style.display =
          'none';

      },
      duration || 3000
    );
}


function setLoading(visible) {

  document
    .getElementById('loading')
    .style.display =
      visible
        ? 'flex'
        : 'none';

  document
    .querySelectorAll('button')
    .forEach(
      function(button) {
        button.disabled = visible;
      }
    );
}

</script>

</body>
</html>
